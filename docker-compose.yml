version: '3.8'

services:
  db:
    image: postgres:15
    container_name: bhv_postgres
    restart: always
    environment:
      POSTGRES_USER: user_bhv
      POSTGRES_PASSWORD: password_bhv
      POSTGRES_DB: db_transfer
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: