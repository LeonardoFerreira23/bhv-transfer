<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Behive Tecnologia | Upload de Vistoria</title>
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 40px; border-radius: 12px; shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #263238; text-align: center; margin-bottom: 30px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #455a64; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cfd8dc; border-radius: 6px; box-sizing: border-box; }
        #dropzone-area { border: 2px dashed #37474f; border-radius: 8px; min-height: 200px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; cursor: pointer; transition: 0.3s; }
        #dropzone-area:hover { background: #e3f2fd; border-color: #1e88e5; }
    </style>
</head>
<body>

<div class="card">
    <h2>Behive Transfer</h2>
    
    <label>ID do Site (UUID):</label>
    <input type="text" id="siteId" placeholder="Ex: 46e7d473-dc2b-4d58...">
    
    <label>Nome do Técnico:</label>
    <input type="text" id="nomeTecnico" placeholder="Seu nome completo">

    <div id="dropzone-area" class="dropzone">
        <div class="dz-message">Arraste seu arquivo .ZIP ou .RAR aqui</div>
    </div>
</div>

<script>
    Dropzone.autoDiscover = false;

    const myDropzone = new Dropzone("#dropzone-area", {
        url: "http://localhost:8080/api/uploads",
        paramName: "fotos", 
        maxFiles: 1,
        acceptedFiles: ".zip,.rar,.7z",
        autoProcessQueue: true,
        init: function() {
            this.on("sending", function(file, xhr, formData) {
                // Anexa os dados do formulário ao envio do arquivo
                formData.append("siteId", document.getElementById("siteId").value);
                formData.append("nomeTecnico", document.getElementById("nomeTecnico").value);
            });
            this.on("success", function(file, response) {
                alert("Vistoria enviada com sucesso para o servidor da Behive!");
                this.removeFile(file);
            });
            this.on("error", function(file, message) {
                alert("Falha no envio: " + (message.error || message));
                this.removeFile(file);
            });
        }
    });
</script>
</body>
</html>
