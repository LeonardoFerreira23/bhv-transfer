<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Behive Tecnologia | Upload de Vistoria</title>
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #263238; text-align: center; margin-bottom: 30px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #455a64; }
        
        /* O estilo agora se aplica tanto para input quanto para o select */
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cfd8dc; border-radius: 6px; box-sizing: border-box; background-color: #fff; font-size: 15px; }
        
        #dropzone-area { border: 2px dashed #37474f; border-radius: 8px; min-height: 200px; display: flex; align-items: center; justify-content: center; background: #f8f9fa; cursor: pointer; transition: 0.3s; }
        #dropzone-area:hover { background: #e3f2fd; border-color: #1e88e5; }
        .dz-message { color: #7f8c8d; font-weight: 500; }
        
        /* Estilos da caixa de sucesso e do link gerado */
        #resultado { display: none; margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; border: 1px solid #c8e6c9; }
        #resultado strong { color: #2e7d32; display: block; margin-bottom: 10px; }
        #linkDownload { color: #1565c0; word-break: break-all; font-weight: 600; text-decoration: none; }
        #linkDownload:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Behive Transfer</h2>
    
    <label>Selecione o Técnico:</label>
    <select id="tecnicoSelect">
        <option value="">Carregando técnicos...</option>
    </select>
    
    <label>Selecione o Site:</label>
    <select id="siteSelect">
        <option value="">Carregando sites...</option>
    </select>

    <div id="dropzone-area" class="dropzone">
        <div class="dz-message">Arraste seu arquivo .ZIP ou .RAR aqui</div>
    </div>

    <div id="resultado">
        <strong>Upload concluído com sucesso!</strong>
        <span style="color: #455a64; font-size: 14px;">Link para download da vistoria:</span><br>
        <a id="linkDownload" href="#" target="_blank"></a>
    </div>
</div>

<script>
    // 1. Ao abrir a página, busca os nomes e sites do banco de dados (sem o usuário precisar digitar UUID)
    fetch('http://localhost:8080/api/uploads/dados-iniciais')
        .then(res => {
            if(!res.ok) throw new Error('Erro na conexão com a API');
            return res.json();
        })
        .then(data => {
            const tSel = document.getElementById('tecnicoSelect');
            const sSel = document.getElementById('siteSelect');
            
            // Popula as listas com os dados reais e esconde os UUIDs no "value"
            tSel.innerHTML = '<option value="">Escolha seu nome...</option>' + 
                data.tecnicos.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
            
            sSel.innerHTML = '<option value="">Escolha o site da vistoria...</option>' + 
                data.sites.map(s => `<option value="${s.id}">${s.nome}</option>`).join('');
        })
        .catch(err => {
            console.error(err);
            alert("Erro ao carregar os dados do servidor. O backend está rodando?");
        });

    // 2. Configuração do arrastar e soltar (Dropzone)
    Dropzone.autoDiscover = false;

    const myDropzone = new Dropzone("#dropzone-area", {
        url: "http://localhost:8080/api/uploads",
        paramName: "fotos", 
        maxFiles: 1,
        acceptedFiles: ".zip,.rar,.7z",
        autoProcessQueue: true,
        init: function() {
            
            this.on("sending", function(file, xhr, formData) {
                const tecnicoId = document.getElementById("tecnicoSelect").value;
                const siteId = document.getElementById("siteSelect").value;

                // Bloqueia o envio se o técnico não preencheu as listas
                if (!tecnicoId || !siteId) {
                    alert("Por favor, selecione o Técnico e o Site antes de enviar o arquivo.");
                    this.removeFile(file);
                    xhr.abort(); // Mata a requisição pro Java não quebrar
                    return;
                }

                // Anexa os UUIDs de forma invisível para o Java processar
                formData.append("tecnicoId", tecnicoId);
                formData.append("siteId", siteId);
            });
            
            this.on("success", function(file, response) {
                const resDiv = document.getElementById("resultado");
                const linkA = document.getElementById("linkDownload");
                
                // Exibe a div de sucesso
                resDiv.style.display = "block";
                
                // Configura o link gerado pelo seu UploadService
                linkA.href = response.link;
                linkA.innerText = response.link;
                
                this.removeFile(file); // Limpa o quadrado azul para o próximo envio
            });
            
            this.on("error", function(file, message) {
                // Pega a mensagem de erro formatada que o Java mandou
                let erroReal = message.erro || message;
                alert("Falha no envio: " + erroReal);
                this.removeFile(file);
            });
        }
    });
</script>
</body>
</html>
